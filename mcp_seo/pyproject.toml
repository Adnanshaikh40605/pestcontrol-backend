[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-seo"
version = "1.0.0"
description = "Read-only SEO MCP server for PestControl99 and DeepCleaning99"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.0",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
mcp-seo = "mcp_seo.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
