name: pest_99_customer_app
description: Pest Control 99 — Customer App
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_secure_storage: 9.2.4
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  in_app_update: ^4.2.3
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/logo/splash_logo_square.png
    icon_background_color: "#FFFFFF"
  android: true
  ios: true
  web: false
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
